name: Build Alrafidain Tik Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/profile-settings-followers]
    paths:
      - "native-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native Android debug APK
        run: gradle -p native-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alrafidain-tik-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
